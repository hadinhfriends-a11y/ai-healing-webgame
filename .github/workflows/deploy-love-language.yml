name: Deploy Love Language Game

on:
  push:
    branches: [main]
    paths:
      - 'love-language/**'
      - '.github/workflows/deploy-love-language.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: love-language
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
