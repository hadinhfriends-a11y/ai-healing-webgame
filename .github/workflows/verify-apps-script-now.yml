name: Verify Apps Script now

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-apps-script-now.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend
        run: |
          set -euxo pipefail
          curl -fLsS 'https://script.google.com/macros/s/AKfycbw9qLBLLtLl-xuVS5qyYbxxz0dkt6EBxE-3Mb_dipviTqDpTGK4GWT9YkwukERw8nvg/exec?action=ping' | tee /tmp/ping.txt
          grep -q 'AI INNER LAB' /tmp/ping.txt
      - name: Post live verification result
        run: |
          set -euxo pipefail
          ID="260825-liveverify-${GITHUB_RUN_ID}"
          echo "ID=$ID" >> "$GITHUB_ENV"
          cat > /tmp/payload.json <<EOF
          {"submissionId":"$ID","testKey":"ai","testTitle":"AI Readiness","name":"CHATGPT LIVE VERIFY","contact":"","ageGroup":"","recommendedTest":"ai","surveySnapshot":{"self":80,"patterns":80,"agency":80,"ai":80},"surveyAnswers":[],"answers":[],"resultData":{"primaryTitle":"AI Builder","headline":"Live verification","scoreSummary":"verify 100%","scores":{"workflow":5}},"utm":{"source":"chatgpt-liveverify"}}
          EOF
          curl -fLsS -H 'Content-Type: text/plain;charset=UTF-8' --data-binary @/tmp/payload.json 'https://script.google.com/macros/s/AKfycbw9qLBLLtLl-xuVS5qyYbxxz0dkt6EBxE-3Mb_dipviTqDpTGK4GWT9YkwukERw8nvg/exec' | tee /tmp/post.txt
          grep -q '"ok":true' /tmp/post.txt
      - name: Verify saved result
        run: |
          set -euxo pipefail
          sleep 2
          curl -fLsS "https://script.google.com/macros/s/AKfycbw9qLBLLtLl-xuVS5qyYbxxz0dkt6EBxE-3Mb_dipviTqDpTGK4GWT9YkwukERw8nvg/exec?action=getResult&id=${ID}&callback=cb" | tee /tmp/get.txt
          grep -q "$ID" /tmp/get.txt
