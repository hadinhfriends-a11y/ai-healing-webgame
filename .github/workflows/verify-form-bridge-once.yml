name: Verify form bridge once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-form-bridge-once.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Submit exactly like browser form bridge
        run: |
          set -euxo pipefail
          ID="260825-formverify-${GITHUB_RUN_ID}"
          echo "ID=$ID" >> "$GITHUB_ENV"
          PAYLOAD=$(cat <<EOF
          {"submissionId":"$ID","testKey":"ai","name":"CHATGPT FORM VERIFY","contact":"","ageGroup":"","recommendedTest":"ai","surveySnapshot":{"self":80,"patterns":80,"agency":80,"ai":80},"surveyAnswers":[],"answers":[],"resultData":{"primaryTitle":"AI Builder","headline":"Form bridge verification","scoreSummary":"form 100%","scores":{"workflow":5}},"utm":{"source":"chatgpt-formverify"}}
          EOF
          )
          curl -fLsS --data-urlencode "payload=$PAYLOAD" 'https://script.google.com/macros/s/AKfycbw9qLBLLtLl-xuVS5qyYbxxz0dkt6EBxE-3Mb_dipviTqDpTGK4GWT9YkwukERw8nvg/exec' | tee /tmp/post.txt
          grep -q '"ok":true' /tmp/post.txt
      - name: Verify saved result
        run: |
          set -euxo pipefail
          sleep 2
          curl -fLsS "https://script.google.com/macros/s/AKfycbw9qLBLLtLl-xuVS5qyYbxxz0dkt6EBxE-3Mb_dipviTqDpTGK4GWT9YkwukERw8nvg/exec?action=getResult&id=${ID}&callback=cb" | tee /tmp/get.txt
          grep -q "$ID" /tmp/get.txt
