name: Inject Apps Script bridge

on:
  push:
    branches: [main]
    paths:
      - 'api-bridge.js'
      - 'upgrade-v2.js'
      - 'wheel-fix.js'
      - '.github/workflows/inject-api-bridge.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Inject runtime scripts
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'<script src="api-bridge\.js\?v=\d+"></script>','<script src="api-bridge.js?v=6"></script>',s)
          if '<script src="api-bridge.js?v=6"></script>' not in s:
              s=s.replace('</body>','<script src="api-bridge.js?v=6"></script>\n</body>')
          s=re.sub(r'\n?<script src="upgrade-v2\.js\?v=\d+"></script>','',s)
          s=re.sub(r'\n?<script src="wheel-fix\.js\?v=\d+"></script>','',s)
          s=s.replace('<script src="api-bridge.js?v=6"></script>','<script src="api-bridge.js?v=6"></script>\n<script src="upgrade-v2.js?v=1"></script>\n<script src="wheel-fix.js?v=1"></script>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patched index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Load Lucky Wheel motion fix" || exit 0
          git push
