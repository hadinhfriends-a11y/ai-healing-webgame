name: Inject Apps Script bridge

on:
  push:
    branches: [main]
    paths:
      - 'api-bridge.js'
      - 'upgrade-v2.js'
      - 'enneagram-tie-fix.js'
      - 'result-clarity.js'
      - 'wheel-fix.js'
      - 'gift-v6.js'
      - 'gift-layout-fix.js'
      - 'gift-explosion-v7.js'
      - 'gift-speed-v8.js'
      - 'zalo-reward-v9.js'
      - 'quick-profile-v10.js'
      - '.github/workflows/inject-api-bridge.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Inject runtime scripts
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'<script src="api-bridge\.js\?v=\d+"></script>','<script src="api-bridge.js?v=6"></script>',s)
          if '<script src="api-bridge.js?v=6"></script>' not in s:
              s=s.replace('</body>','<script src="api-bridge.js?v=6"></script>\n</body>')
          for name in ['upgrade-v2','enneagram-tie-fix','result-clarity','wheel-fix','gift-v6','gift-layout-fix','gift-explosion-v7','gift-speed-v8','zalo-reward-v9','quick-profile-v10']:
              s=re.sub(r'\n?<script src="'+re.escape(name)+r'\.js\?v=\d+"></script>','',s)
          s=s.replace('<script src="api-bridge.js?v=6"></script>','<script src="api-bridge.js?v=6"></script>\n<script src="upgrade-v2.js?v=1"></script>\n<script src="enneagram-tie-fix.js?v=2"></script>\n<script src="result-clarity.js?v=1"></script>\n<script src="wheel-fix.js?v=5"></script>\n<script src="gift-v6.js?v=4"></script>\n<script src="gift-layout-fix.js?v=1"></script>\n<script src="gift-explosion-v7.js?v=1"></script>\n<script src="gift-speed-v8.js?v=1"></script>\n<script src="zalo-reward-v9.js?v=1"></script>\n<script src="quick-profile-v10.js?v=1"></script>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patched index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Load Quick Profile funnel v10" || exit 0
          git push
