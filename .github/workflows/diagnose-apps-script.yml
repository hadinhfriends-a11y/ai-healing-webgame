name: Diagnose Apps Script backend

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-apps-script.yml'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend
        run: |
          set -euxo pipefail
          curl -fLsS 'https://script.google.com/macros/s/AKfycbw9qLBLLtLl-xuVS5qyYbxxz0dkt6EBxE-3Mb_dipviTqDpTGK4GWT9YkwukERw8nvg/exec?action=ping' | tee /tmp/ping.txt
          grep -q 'AI INNER LAB' /tmp/ping.txt
      - name: Post debug result
        run: |
          set -euxo pipefail
          ID="260825-chatgpt-debug-${GITHUB_RUN_ID}"
          echo "ID=$ID" >> "$GITHUB_ENV"
          cat > /tmp/payload.json <<EOF
          {"submissionId":"$ID","testKey":"ai","testTitle":"AI Readiness","name":"CHATGPT DEBUG","contact":"","ageGroup":"","recommendedTest":"ai","surveySnapshot":{"self":80,"patterns":80,"agency":80,"ai":80},"surveyAnswers":[],"answers":[],"resultData":{"primaryTitle":"AI Builder","headline":"Integration debug","scoreSummary":"debug 100%","scores":{"workflow":5}},"utm":{"source":"chatgpt-debug"}}
          EOF
          curl -fLsS -X POST -H 'Content-Type: text/plain;charset=UTF-8' --data-binary @/tmp/payload.json 'https://script.google.com/macros/s/AKfycbw9qLBLLtLl-xuVS5qyYbxxz0dkt6EBxE-3Mb_dipviTqDpTGK4GWT9YkwukERw8nvg/exec' | tee /tmp/post.txt
          grep -q '"ok":true' /tmp/post.txt
      - name: Verify result
        run: |
          set -euxo pipefail
          sleep 2
          curl -fLsS "https://script.google.com/macros/s/AKfycbw9qLBLLtLl-xuVS5qyYbxxz0dkt6EBxE-3Mb_dipviTqDpTGK4GWT9YkwukERw8nvg/exec?action=getResult&id=${ID}&callback=cb" | tee /tmp/get.txt
          grep -q "$ID" /tmp/get.txt
