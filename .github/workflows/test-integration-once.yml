name: Test integration once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test-integration-once.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Apps Script
        run: |
          curl -fsSL 'https://script.google.com/macros/s/AKfycbw9qLBLLtLl-xuVS5qyYbxxz0dkt6EBxE-3Mb_dipviTqDpTGK4GWT9YkwukERw8nvg/exec?action=ping' | tee /tmp/ping.txt
          grep -q 'AI INNER LAB' /tmp/ping.txt
      - name: Post synthetic result
        run: |
          ID="260817-systemtest-${GITHUB_RUN_ID}"
          echo "ID=$ID" >> "$GITHUB_ENV"
          cat > /tmp/payload.json <<EOF
          {"submissionId":"$ID","testKey":"ai","testTitle":"AI Readiness","name":"SYSTEM TEST","contact":"","ageGroup":"","recommendedTest":"ai","surveySnapshot":{"self":80,"patterns":75,"agency":85,"ai":90},"surveyAnswers":[],"answers":[],"resultData":{"primaryTitle":"AI Builder","headline":"Integration test","scoreSummary":"test 100%","scores":{"workflow":5}},"utm":{"source":"github-actions-test"}}
          EOF
          curl -fsSL -H 'Content-Type: text/plain;charset=UTF-8' --data-binary @/tmp/payload.json 'https://script.google.com/macros/s/AKfycbw9qLBLLtLl-xuVS5qyYbxxz0dkt6EBxE-3Mb_dipviTqDpTGK4GWT9YkwukERw8nvg/exec' | tee /tmp/post.txt
          grep -q '"ok":true' /tmp/post.txt
      - name: Verify saved result
        run: |
          sleep 2
          curl -fsSL "https://script.google.com/macros/s/AKfycbw9qLBLLtLl-xuVS5qyYbxxz0dkt6EBxE-3Mb_dipviTqDpTGK4GWT9YkwukERw8nvg/exec?action=getResult&id=${ID}&callback=cb" | tee /tmp/get.txt
          grep -q "$ID" /tmp/get.txt
