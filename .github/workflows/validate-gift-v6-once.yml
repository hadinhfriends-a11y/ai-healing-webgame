name: Validate Mystery Gift v6 once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/validate-gift-v6-once.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check gift JavaScript syntax
        run: node --check gift-v6.js
      - name: Check Apps Script syntax
        run: |
          cp Code.gs /tmp/Code.js
          node --check /tmp/Code.js
      - name: Confirm production script
        run: grep -q 'gift-v6.js?v=1' index.html
