const TESTS = {
  enneagram:{title:'Enneagram Mini',icon:'✺',time:'~3 phút',blurb:'Hiểu kiểu tính cách, động lực và giá trị cốt lõi.',dims:['1','2','3','4','5','6','7','8','9'],labels:{'1':'Người Cải Tiến','2':'Người Trợ Giúp','3':'Người Thành Tựu','4':'Người Cá Tính','5':'Người Quan Sát','6':'Người Trung Thành','7':'Người Khám Phá','8':'Người Thách Thức','9':'Người Hòa Giải'},q:[
    ['Tôi khó chịu khi mọi thứ cẩu thả hoặc không đúng chuẩn.','1'],['Tôi thường tự hỏi mình có đang làm điều đúng đắn không.','1'],['Tôi dễ nhận ra người khác cần gì và muốn giúp họ.','2'],['Tôi thường cảm thấy mình phải trở nên hữu ích thì mới có giá trị.','2'],['Tôi có xu hướng đo giá trị của mình bằng kết quả đạt được.','3'],['Tôi dễ tăng tốc khi có mục tiêu rõ ràng và được công nhận.','3'],['Tôi muốn được là chính mình hơn là giống số đông.','4'],['Tôi thường cảm nhận cảm xúc của mình rất sâu.','4'],['Tôi thích quan sát, tìm hiểu kỹ trước khi tham gia.','5'],['Tôi cần có không gian riêng để nạp lại năng lượng.','5'],['Tôi thường nghĩ trước về rủi ro để tránh bị động.','6'],['Sự tin cậy và cảm giác an toàn rất quan trọng với tôi.','6'],['Tôi nhanh hứng thú với ý tưởng, trải nghiệm và khả năng mới.','7'],['Khi khó chịu, tôi thường tìm cách chuyển sang điều tích cực hơn.','7'],['Tôi không thích bị kiểm soát hoặc cảm thấy mình yếu thế.','8'],['Khi cần, tôi sẵn sàng đứng ra quyết định và bảo vệ người khác.','8'],['Tôi thường cố giữ hòa khí hơn là tạo xung đột.','9'],['Tôi có thể trì hoãn nhu cầu của mình để mọi chuyện êm hơn.','9']],
    descriptions:{'1':'Bạn hướng đến sự đúng đắn, chất lượng và cải thiện. Điểm mù dễ gặp là quá nghiêm với bản thân.','2':'Bạn dễ kết nối và chăm sóc người khác. Điểm mù dễ gặp là quên hỏi mình thật sự cần gì.','3':'Bạn mạnh về mục tiêu và thích biến nỗ lực thành kết quả. Điểm mù dễ gặp là gắn giá trị bản thân với thành tích.','4':'Bạn coi trọng bản sắc và chiều sâu cảm xúc. Điểm mù dễ gặp là quá tập trung vào điều còn thiếu.','5':'Bạn thích hiểu rõ trước khi hành động và coi trọng sự tự chủ. Điểm mù dễ gặp là đứng ngoài trải nghiệm quá lâu.','6':'Bạn nhạy với rủi ro, lòng trung thành và sự đáng tin. Điểm mù dễ gặp là để những kịch bản xấu chiếm quá nhiều năng lượng.','7':'Bạn hướng tới tự do, khả năng và trải nghiệm mới. Điểm mù dễ gặp là chuyển hướng quá nhanh trước cảm xúc khó chịu.','8':'Bạn coi trọng sức mạnh, sự thẳng thắn và quyền tự quyết. Điểm mù dễ gặp là phải luôn mạnh ngay cả khi cần mềm lại.','9':'Bạn giỏi tạo sự ổn định và hòa hợp. Điểm mù dễ gặp là làm mờ mong muốn của chính mình.'}},
  direction:{title:'Life Direction',icon:'✦',time:'~2 phút',blurb:'Bạn thật sự muốn đi về đâu?',dims:['clarity','energy','alignment','momentum'],labels:{clarity:'Rõ hướng',energy:'Năng lượng',alignment:'Đồng nhất',momentum:'Hành động'},q:[['Tôi biết khá rõ điều mình muốn trong 12 tháng tới.','clarity'],['Tôi có thể nói “không” với cơ hội không hợp ưu tiên.','clarity'],['Tôi hiểu điều gì thực sự quan trọng với mình lúc này.','clarity'],['Phần lớn ngày của tôi có đủ năng lượng để làm việc quan trọng.','energy'],['Tôi có khoảng nghỉ thực sự giúp mình hồi phục.','energy'],['Tôi thức dậy mà không thường xuyên cảm thấy cạn pin.','energy'],['Cách tôi dùng thời gian phản ánh điều tôi nói là quan trọng.','alignment'],['Các mối quan hệ và môi trường hiện tại khá phù hợp với giá trị của tôi.','alignment'],['Tôi ít phải “đóng vai” một phiên bản không giống mình.','alignment'],['Tôi biến mục tiêu thành bước nhỏ có lịch thực hiện.','momentum'],['Tôi thường bắt đầu trước khi mọi thứ hoàn hảo.','momentum'],['Tôi duy trì được nhịp hành động đều hơn là chỉ bùng nổ ngắn hạn.','momentum']]},

function renderFocus(){show(`<section class="content-pad"><div class="focus-layout"><div class="focus-intro"><span class="kicker">Bước 1/2</span><h2><span class="grad-text">Điều gì</span> khiến bạn tò mò nhất về chính mình?</h2><p class="lead">Chọn chủ đề gần với bạn nhất. AI sẽ đề xuất bài test phù hợp chỉ trong vài giây.</p><div class="lock-note" style="margin-top:28px"><span class="shield">♢</span><span><b>100% riêng tư & bảo mật</b><br>Câu trả lời dùng để gợi ý bài test và lưu kết quả nếu bạn đồng ý.</span></div></div>
<div class="focus-cards">${FOCUS.map((f,i)=>`<div class="focus-card ${state.focusKey===f.key?'selected':''}" onclick="selectFocus('${f.key}')"><span class="n">${i+1}</span><div class="icon-circle">${h(f.icon)}</div><strong>${h(f.title)}</strong><p>${h(f.desc)}</p></div>`).join('')}</div>
<div class="recommend-panel glass"><div class="orb-wrap" style="min-height:125px">${orb()}</div><div><span class="kicker">✦ AI đề xuất</span><div class="rec-title">${h(TESTS[state.focusKey].title)}</div><p class="muted" style="margin:0 0 12px">${focusReason(state.focusKey)}</p><div class="badges"><span class="badge">♙ Cá nhân hóa</span><span class="badge">◷ ${h(TESTS[state.focusKey].time)}</span><span class="badge">☆ 5 mini tests</span></div></div><div class="rec-actions"><button class="btn-primary" onclick="confirmFocus()">Tiếp tục →</button><button class="btn" onclick="renderTestGallery()">Xem tất cả</button></div></div></div></section>`)}
function selectFocus(k){state.focusKey=k;renderFocus()}
function focusReason(k){return {enneagram:'Vì bạn đang muốn hiểu kiểu tính cách và động lực cốt lõi của mình.',direction:'Vì bạn muốn tìm lại la bàn, ưu tiên và đà hành động.',career:'Vì bạn muốn đặt năng lực của mình vào môi trường phù hợp hơn.',attachment:'Vì bạn muốn hiểu cách mình phản ứng khi gần gũi và khi có căng thẳng trong quan hệ.',ai:'Vì bạn muốn biết mình đang ở đâu và nên nâng cấp năng lực AI nào trước.'}[k]}
function confirmFocus(){state.recommended=state.focusKey;startTest(state.focusKey)}
function renderTestGallery(){show(`<section class="content-pad"><div class="gallery-head"><span class="kicker">5 MÓN QUÀ TỰ KHÁM PHÁ</span><h2 class="section-title">Chọn một bản đồ bạn muốn mở</h2><p class="muted">Mỗi bài chỉ 2–4 phút và trả kết quả ngay. Đây là công cụ tự khám phá, không phải đánh giá lâm sàng.</p></div><div class="gallery">${Object.entries(TESTS).map(([k,t])=>`<div class="test-card ${state.recommended===k?'recommended':''}" onclick="startTest('${k}')"><div class="icon-circle">${h(t.icon)}</div><h3>${h(t.title)}</h3><p>${h(t.blurb)}</p><div class="time">◷ ${h(t.time)}</div></div>`).join('')}</div><div class="btn-row" style="justify-content:center;margin-top:20px"><button class="btn" onclick="renderFocus()">← Quay lại</button></div></section>`)}

function startTest(k){state.testKey=k;state.qIndex=0;state.answers=[];renderQuestion()}
function renderQuestion(){const t=TESTS[state.testKey],i=state.qIndex,q=t.q[i],progress=Math.round(i/t.q.length*100);show(`<section class="content-pad"><div class="quiz-shell"><div class="quiz-main glass"><div class="top-progress"><span style="font-weight:900">Câu ${i+1}/${t.q.length}</span><div class="progress-track"><div class="progress-fill" style="width:${progress}%"></div></div><b>${progress}%</b><span class="badge">◷ Còn khoảng ${Math.max(1,Math.ceil((t.q.length-i)*8/60))} phút</span></div><div class="quiz-card"><div class="question-label">✦ CÂU HỎI</div><div class="quiz-big">${h(q[0])}</div><div class="helper">✦ Không có đáp án đúng hay sai. Hãy chọn điều gần với bạn nhất.</div><div class="quiz-scale">${[['1','Rất không giống tôi'],['2','Không giống'],['3','Trung lập'],['4','Giống'],['5','Rất giống tôi']].map(([v,l])=>`<button class="quiz-option ${state.answers[i]==v?'selected':''}" onclick="answerTest(${v})"><span class="answer-num">${v}</span><strong>${l}</strong></button>`).join('')}</div></div><div class="quiz-footer"><button class="btn" onclick="${i?'prevQuestion()':'renderTestGallery()'}">← Quay lại</button><span class="tiny">🔒 Kết quả có thể được lưu thành link riêng.</span></div></div><aside class="quiz-side side-card glass"><div class="tiny">✦ AI INNER LAB · ${h(t.title)}</div><div class="orb-wrap" style="min-height:125px">${orb()}</div><div class="assistant-msg"><strong>Bạn đang làm rất tốt!</strong><span>Hãy lắng nghe trực giác của bạn nhé.</span></div><div class="side-stats"><div class="side-stat"><strong>${progress}%</strong><span>Hoàn thành</span></div><div class="side-stat"><strong>${t.q.length-i-1}</strong><span>Câu còn lại</span></div></div><div class="tiny" style="margin:5px 0 9px;font-weight:800">TIẾN TRÌNH CÂU HỎI</div><div class="dot-grid">${t.q.map((_,x)=>`<span class="qdot ${x<i?'done':x===i?'active':''}">${x+1}</span>`).join('')}</div><div class="tip-box"><b style="color:#d78aff">Mẹo từ AI</b><br>Đừng cố trả lời “đẹp”. Kết quả có ích hơn khi bạn trả lời đúng với mình.</div></aside></div></section>`)}
function answerTest(v){state.answers[state.qIndex]=v;if(state.qIndex<TESTS[state.testKey].q.length-1){state.qIndex++;renderQuestion()}else{state.result=computeResult();renderLead()}}
function prevQuestion(){if(state.qIndex>0){state.qIndex--;renderQuestion()}}

function computeResult(){const key=state.testKey,t=TESTS[key],avg=scoreLikert(t,state.answers),sorted=sortedScores(avg);let primaryKey=sorted[0][0],primaryTitle='',headline='',description='',blindSpot='',strength='',nextStep='',scoreSummary='',tags=[];
  if(key==='enneagram'){primaryTitle=`Type ${primaryKey} · ${t.labels[primaryKey]}`;headline='Type nổi bật của bạn';description=t.descriptions[primaryKey];strength={1:'Tiêu chuẩn cao và tinh thần cải tiến',2:'Khả năng kết nối và hỗ trợ',3:'Khả năng hành động và tạo kết quả',4:'Chiều sâu cảm xúc và bản sắc',5:'Quan sát và phân tích sâu',6:'Trung thành và nhận diện rủi ro',7:'Khả năng thấy cơ hội',8:'Quyết đoán và bảo vệ',9:'Tạo ổn định và hòa hợp'}[primaryKey];blindSpot={1:'Quá nghiêm với bản thân',2:'Quên nhu cầu của chính mình',3:'Đồng nhất giá trị bản thân với thành tích',4:'Tập trung quá lâu vào điều còn thiếu',5:'Quan sát quá lâu trước khi bước vào trải nghiệm',6:'Cho kịch bản xấu quá nhiều năng lượng',7:'Né cảm xúc khó bằng điều mới',8:'Phải luôn mạnh ngay cả khi cần mềm',9:'Làm mờ mong muốn của chính mình'}[primaryKey];nextStep='Quan sát một tuần: khi bị căng thẳng, bạn đang cố bảo vệ điều gì? Sau đó chọn một phản ứng mới nhỏ hơn nhưng thật hơn.';scoreSummary=sorted.slice(0,4).map(([d,v])=>`T${d} ${pct(v)}%`).join(' · ');tags=['Thực tiễn','Hiệu suất cao','Định hướng mục tiêu'];}
  else if(key==='career'){const code=sorted.slice(0,2).map(x=>x[0]).join('');primaryTitle=`Career DNA ${code} · ${t.labels[sorted[0][0]]} + ${t.labels[sorted[1][0]]}`;headline='Môi trường giúp bạn có năng lượng';description=`Bạn nổi bật ở ${t.labels[sorted[0][0]].toLowerCase()} và ${t.labels[sorted[1][0]].toLowerCase()}. Hãy ưu tiên vai trò cho phép hai xu hướng này cùng xuất hiện.`;strength=`${t.labels[sorted[0][0]]} + ${t.labels[sorted[1][0]]}`;blindSpot='Chọn chức danh “đẹp” nhưng môi trường không dùng được năng lực thật.';nextStep='Chọn 3 công việc bạn đang cân nhắc và chấm xem mỗi công việc cho bạn bao nhiêu cơ hội dùng hai nhóm năng lực dẫn đầu.';scoreSummary=sorted.map(([d,v])=>`${d} ${pct(v)}%`).join(' · ');tags=['Năng lực','Môi trường','Định hướng'];}
  else if(key==='attachment'){primaryTitle=t.labels[primaryKey];headline='Xu hướng gắn bó nổi bật';description=t.descriptions[primaryKey];strength=primaryKey==='secure'?'Cân bằng gần gũi và tự chủ':'Nhạy với tín hiệu an toàn trong quan hệ';blindSpot=primaryKey==='anxious'?'Diễn giải khoảng cách thành bị bỏ rơi':primaryKey==='avoidant'?'Rút lui khi cảm xúc quá gần':primaryKey==='fearful'?'Tiến gần rồi lùi ra khi quan hệ quan trọng':'Có thể đánh giá thấp những lúc mình cũng cần hỗ trợ';nextStep='Khi có căng thẳng, gọi tên nhu cầu thật trước khi phản ứng: xác nhận, khoảng riêng, sự rõ ràng hay cảm giác an toàn?';scoreSummary=sorted.map(([d,v])=>`${t.labels[d]} ${pct(v)}%`).join(' · ');tags=['Kết nối','An toàn','Ranh giới'];}
  else if(key==='direction'){const low=Object.entries(avg).sort((a,b)=>a[1]-b[1])[0][0],overall=Object.values(avg).reduce((a,b)=>a+b,0)/4;const map={clarity:['Người đang tìm lại la bàn','Bạn có thể chưa thiếu năng lực; điều thiếu là một ưu tiên đủ rõ để loại bỏ nhiễu.','Nhiều lựa chọn cùng lúc'],energy:['Người cần hồi phục năng lượng','Hướng đi có thể không phải vấn đề lớn nhất; mức năng lượng hiện tại đang làm mọi quyết định khó hơn.','Cố thêm khi pin đã thấp'],alignment:['Người đang sống lệch ưu tiên','Có khoảng cách giữa điều bạn nói là quan trọng và cách thời gian/năng lượng đang thực sự được dùng.','Lịch sống không khớp giá trị'],momentum:['Người biết nhưng chưa vào guồng','Bạn có thể đã hiểu khá nhiều về điều mình muốn, nhưng hành động chưa đủ đều để tạo đà.','Chờ hoàn hảo rồi mới bắt đầu']};primaryKey=low;primaryTitle=overall>=4.1?'Người đang vào nhịp':map[low][0];headline='La bàn hiện tại của bạn';description=overall>=4.1?'Bốn trụ cột của bạn đang khá đồng đều: rõ hướng, năng lượng, đồng nhất và hành động. Thách thức tiếp theo là giữ nhịp mà không tự quá tải.':map[low][1];strength='Khả năng tự nhìn lại và điều chỉnh hướng đi';blindSpot=overall>=4.1?'Quá tải vì muốn giữ nhịp cao':map[low][2];nextStep=overall>=4.1?'Chọn một mục tiêu 90 ngày và xác định tín hiệu sớm cho thấy bạn đang quá tải hoặc lệch hướng.':'Viết một câu: “Trong 90 ngày tới, điều quan trọng nhất của tôi là…” rồi đặt một bước dưới 20 phút vào lịch trong 48 giờ tới.';scoreSummary=sorted.map(([d,v])=>`${t.labels[d]} ${pct(v)}%`).join(' · ');tags=['Rõ hướng','Năng lượng','Hành động'];}
  else if(key==='ai'){const overall=Object.values(avg).reduce((a,b)=>a+b,0)/4;const level=overall<2.5?['AI Explorer','Bạn đang ở giai đoạn khám phá. Giá trị lớn nhất lúc này là biến AI từ “thỉnh thoảng hỏi” thành một thói quen có chủ đích.']:overall<3.5?['AI Operator','Bạn đã biết dùng AI cho nhiều việc, nhưng quy trình và cách kiểm chứng còn có thể nâng cấp mạnh.']:overall<4.3?['AI Builder','Bạn đã có tư duy hệ thống khá tốt và đang tiến gần việc biến AI thành một lớp năng lực thường trực.']:['AI Co-pilot','Bạn đang dùng AI như một cộng sự có quy trình, đồng thời vẫn giữ vai trò phán đoán của con người.'];primaryTitle=level[0];headline='Mức sẵn sàng với AI';description=level[1];const low=Object.entries(avg).sort((a,b)=>a[1]-b[1])[0][0];strength='Khả năng học và phối hợp với công cụ mới';blindSpot=`Trụ cột còn yếu hơn: ${t.labels[low]}`;nextStep=`Chọn một việc lặp lại trong tuần này và thiết kế lại nó với AI theo 3 bước: bối cảnh → tiêu chí → kiểm chứng.`;scoreSummary=sorted.map(([d,v])=>`${t.labels[d]} ${pct(v)}%`).join(' · ');tags=['Tư duy AI','Quy trình','Kiểm chứng'];}
  return {testKey:key,primaryKey,primaryTitle,headline,description,strength,blindSpot,nextStep,scores:avg,scoreSummary,tags};
}

function renderLead(){show(`<section class="content-pad"><div class="lead-card glass"><span class="kicker">KẾT QUẢ ĐÃ SẴN SÀNG</span><h2 class="section-title">Mở khóa bản đồ của bạn</h2><p class="muted">Bạn có thể xem kết quả ngay mà không lưu. Nếu muốn có <b>link riêng</b> để mở lại/chia sẻ, hãy nhập thông tin bên dưới.</p><div class="form-grid"><div class="field"><label>Tên / nickname</label><input id="name" placeholder="Ví dụ: Hà"></div><div class="field"><label>Nhóm tuổi</label><select id="age"><option value="">Không muốn cung cấp</option><option>Dưới 18</option><option>18–22</option><option>23–27</option><option>28–35</option><option>36+</option></select></div><div class="field full"><label>Zalo / SĐT (không bắt buộc)</label><input id="contact" placeholder="Nhập Zalo hoặc số điện thoại nếu bạn muốn đội ngũ liên hệ"></div></div><div class="consent">Khi bấm “Lưu & xem kết quả”, câu trả lời và kết quả sẽ được lưu vào Google Sheet của đơn vị vận hành để tạo link kết quả riêng. Trải nghiệm này không phải chẩn đoán hay điều trị tâm lý.</div><div class="btn-row" style="margin-top:18px"><button class="btn-primary" id="saveBtn" onclick="saveAndReveal()">LƯU & XEM KẾT QUẢ →</button><button class="btn" onclick="revealWithoutSaving()">Xem không lưu</button></div></div></section>`)}
function saveAndReveal(){state.profile.name=document.getElementById('name').value.trim();state.profile.contact=document.getElementById('contact').value.trim();state.profile.ageGroup=document.getElementById('age').value;const b=document.getElementById('saveBtn');b.disabled=true;b.innerHTML='<span class="spinner"></span>Đang tạo link';const payload={testKey:state.testKey,testTitle:TESTS[state.testKey].title,name:state.profile.name,contact:state.profile.contact,ageGroup:state.profile.ageGroup,recommendedTest:state.recommended,surveySnapshot:state.surveySnapshot,surveyAnswers:state.surveyAnswers,answers:state.answers,resultData:state.result,utm:state.utm};google.script.run.withSuccessHandler(res=>{state.shareUrl=res.resultUrl||'';renderResult()}).withFailureHandler(err=>{alert('Không lưu được vào Google Sheet: '+(err.message||err));b.disabled=false;b.textContent='LƯU & XEM KẾT QUẢ →'}).saveResult(payload)}
function revealWithoutSaving(){state.shareUrl='';renderResult()}

function renderResult(shared){const r=shared?.resultData||state.result,k=shared?.testKey||state.testKey,t=TESTS[k];if(!r||!t){renderHome();return}const name=shared?.name||state.profile.name||'';const sorted=sortedScores(r.scores||{}).slice(0,4);const isEnnea=k==='enneagram';show(`<section class="content-pad"><div class="result-layout"><div class="result-intro"><span class="kicker">KẾT QUẢ TEST ${h(t.title)}</span><h2>Kết quả của bạn<br>đã <span class="grad-text">sẵn sàng</span></h2><p class="lead">${name?h(name)+' · ':''}${h(t.title)} — bản đồ tự khám phá của bạn.</p></div><div class="result-card glass">${isEnnea?`<div class="tiny">TYPE NỔI BẬT CỦA BẠN</div><div class="ennea-symbol">${h(r.primaryKey)}</div><h3>Type ${h(r.primaryKey)}</h3><div class="result-name">${h(t.labels[r.primaryKey])}</div>`:`<div class="tiny">KẾT QUẢ NỔI BẬT</div><div class="ennea-symbol" style="font-size:36px">${h(t.icon)}</div><h3>${h(r.primaryTitle)}</h3>`}<p class="result-desc">${h(r.description)}</p><div class="tags">${(r.tags||[]).map(x=>`<span class="tag">${h(x)}</span>`).join('')}</div></div><div class="chart-card glass"><div class="chart-title">BIỂU ĐỒ ĐIỂM SỐ NỔI BẬT</div><div class="score-list">${sorted.map(([d,v],idx)=>`<div class="score-row"><div class="score-icon">${idx===0?'✦':idx===1?'♡':idx===2?'◇':'○'}</div><div class="score-label"><strong>${h(isEnnea?'Type '+d:(t.labels[d]||d))}</strong><span>${h(isEnnea?t.labels[d]:'')}</span></div><div class="meter"><span style="width:${pct(v)}%"></span></div><b>${pct(v)}%</b></div>`).join('')}</div></div><div class="insights"><div class="insight"><div class="icon-circle">◇</div><div><h4>Sức mạnh nổi bật</h4><p>${h(r.strength)}</p></div></div><div class="insight"><div class="icon-circle">◉</div><div><h4>Điểm mù</h4><p>${h(r.blindSpot)}</p></div></div><div class="insight"><div class="icon-circle">↗</div><div><h4>Bước nâng cấp tiếp theo</h4><p>${h(r.nextStep)}</p></div></div></div><div class="result-bottom"><div class="share-card glass"><b>↗ &nbsp;Link kết quả riêng</b><div class="tiny" style="margin-top:4px">${state.shareUrl||shared?.resultUrl?'Lưu lại hoặc chia sẻ kết quả này.':'Bạn đang xem ở chế độ không lưu.'}</div>${(state.shareUrl||shared?.resultUrl)?`<div class="share-row"><input id="share" readonly value="${h(state.shareUrl||shared.resultUrl)}"><button class="btn" onclick="copyShare()">Copy</button></div>`:''}</div><div class="course-card glass"><div><span class="kicker">BƯỚC TIẾP THEO</span><h3>${h(APP_CONFIG.courseName)}</h3><p>AI không sống thay bạn. Nhưng nó có thể trở thành chiếc gương giúp bạn hiểu mình, nhìn thấy điểm mù và xây phiên bản tiếp theo.</p></div><div class="btn-row"><button class="btn-primary" onclick="renderCourse()">XEM LỘ TRÌNH CỦA TÔI →</button><button class="btn" onclick="renderTestGallery()">Làm test khác</button></div></div></div></div></section>`)}
function copyShare(){const el=document.getElementById('share');if(!el)return;navigator.clipboard?.writeText(el.value).then(()=>alert('Đã copy link kết quả.')).catch(()=>{el.select();document.execCommand('copy');alert('Đã copy link kết quả.')})}

function renderCourse(){const r=state.result||{};show(`<section class="content-pad"><div class="course-layout"><div class="course-copy"><span class="kicker">✦ BƯỚC CUỐI · CHẠM ĐẾN PHIÊN BẢN TIẾP THEO</span><h2><span class="grad-text">Sẵn sàng nâng cấp</span><br>bản thân trong thời đại AI?</h2><p class="lead">AI không thể sống thay bạn. Nhưng AI có thể trở thành chiếc gương giúp bạn hiểu mình, nhìn thấy điểm mù và xây dựng phiên bản tiếp theo của chính bạn.</p><div class="roadmap">${[['01','♙','Hiểu mình','Khám phá giá trị cốt lõi, điểm mạnh và động lực thật sự.'],['02','◉','Nhìn thấy điểm mù','AI giúp bạn soi chiếu những góc khuất chưa thấy.'],['03','✺','Thay đổi tư duy','Mở rộng góc nhìn, phá bỏ giới hạn cũ.'],['04','↗','Xây dựng phiên bản mới','Biến insight thành hành động nhỏ mỗi ngày.']].map(x=>`<div class="road"><div class="num">${x[0]}</div><div class="icon-circle">${x[1]}</div><strong>${x[2]}</strong><p>${x[3]}</p></div>`).join('')}</div></div><div class="course-hero glass"><span class="kicker">KHÓA HỌC DÀNH CHO BẠN</span><h2 class="course-title">Nâng Cấp<br>Bản Thân<br><span style="font-size:.65em">Trong Thời Đại AI</span></h2><div class="personal-line">♙ Dành riêng cho ${h(r.primaryTitle||'hành trình của bạn')} ✦</div><div class="course-feats"><div class="course-feat">✓ Ứng dụng thực tế</div><div class="course-feat">✦ Bài tập với AI</div><div class="course-feat">▣ Lộ trình 30 ngày</div><div class="course-feat">♙ Cộng đồng đồng hành</div></div><div class="course-actions"><a class="btn-primary" href="${h(APP_CONFIG.courseUrl)}" target="_blank" style="text-decoration:none">XEM LỘ TRÌNH CỦA TÔI →</a><a class="btn" href="${h(APP_CONFIG.courseUrl)}" target="_blank" style="text-decoration:none">Xem chương trình học</a></div><div class="portal"><div class="portal-door"></div></div></div><div class="proof"><div class="proof-card"><strong>4.9/5</strong><div style="color:#ffc44c;margin:5px 0">★★★★★</div><span>Không phải số liệu thật — hãy thay bằng social proof thực tế trước khi chạy quảng cáo.</span></div><div class="proof-card"><strong>30 ngày</strong><br><span>Lộ trình gợi ý để biến hiểu biết thành thói quen và hành động.</span></div><div class="proof-card"><b>“Điều đáng giá nhất không phải AI biết gì về tôi, mà là tôi bắt đầu đặt câu hỏi tốt hơn cho chính mình.”</b><p>— Testimonial mẫu. Hãy thay bằng phản hồi học viên thật.</p></div><div class="proof-card mascot-proof">${orb()}<div><b>AI INNER LAB</b><p>Bạn không cần cố hơn.<br>Bạn cần hiểu mình rõ hơn.</p></div></div></div></div></section>`)}

function loadShared(id){show(`<div class="loading glass"><span class="spinner"></span><b>Đang mở kết quả…</b><p class="muted">Đang tải dữ liệu từ Google Sheet.</p></div>`);google.script.run.withSuccessHandler(res=>{if(!res){show(`<div class="loading glass"><h2>Không tìm thấy kết quả</h2><p class="muted">Link có thể không hợp lệ hoặc dữ liệu đã được xóa.</p><button class="btn-primary" onclick="renderHome()">Làm bài test mới</button></div>`);return}state.testKey=res.testKey;state.shareUrl=res.resultUrl;renderResult(res)}).withFailureHandler(()=>renderHome()).getResult(id)}

if(SERVER_RESULT_ID) loadShared(SERVER_RESULT_ID); else renderHome();
</script>

<script>
(function(){
  const storeKey='aiInnerLabPreviewResults';
  function load(){try{return JSON.parse(localStorage.getItem(storeKey)||'{}')}catch(e){return {}}}
  function save(x){localStorage.setItem(storeKey,JSON.stringify(x))}
  window.google={script:{run:{
    _ok:null,_fail:null,
    withSuccessHandler(fn){this._ok=fn;return this},
    withFailureHandler(fn){this._fail=fn;return this},
    saveResult(payload){try{const id=Math.random().toString(36).slice(2,10);const base=location.href.split('?')[0];const url=base+'?result='+id;const all=load();all[id]={id,testKey:payload.testKey,testTitle:payload.testTitle,name:payload.name,ageGroup:payload.ageGroup,recommendedTest:payload.recommendedTest,resultUrl:url,surveyAnswers:payload.surveyAnswers,answers:payload.answers,resultData:payload.resultData};save(all);const ok=this._ok;setTimeout(()=>ok&&ok({ok:true,id,resultUrl:url}),200)}catch(e){this._fail&&this._fail(e)}},
    getResult(id){const all=load();const ok=this._ok;setTimeout(()=>ok&&ok(all[id]||null),120)}
  }}};
  const id=new URLSearchParams(location.search).get('result');
  if(id){setTimeout(()=>loadShared(id),50)}
})();
</script>
<script src="api-bridge.js?v=3"></script>
</body>
